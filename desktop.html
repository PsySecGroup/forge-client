<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="{{PROJECT_NAME}} - {{PROJECT_DESCRIPTION}}" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph for Social Media -->
    <meta property="og:title" content="{{PROJECT_NAME}}" />
    <meta property="og:description" content="{{PROJECT_DESCRIPTION}}" />
    <meta property="og:image" content="{{ASSET_PATH}}og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{PROJECT_URL}}" />

    <!-- Favicon and icons for various devices -->
    <link rel="shortcut icon" href="{{ASSET_PATH}}favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ASSET_PATH}}apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ASSET_PATH}}favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ASSET_PATH}}favicon-16x16.png" />

{{HEADERS_PRECONNECTS}}

    <!-- SEO-friendly title -->
    <title>{{PROJECT_TITLE}}</title>
  </head>
  <style>
    #viewport {
      height: 100%;
      width: 100%;
    }
  </style>
  <body>
    <noscript>
      <strong>You need to enable JavaScript to run this app.</strong>
    </noscript>
    <div id="viewport"></div>

    <!-- Defer scripts for better loading performance -->
    <script src="/neutralino.js"></script>
    <script src="/src/index.tsx" type="module" defer></script>

    <!-- Service worker registration for PWA features -->
    <script>
      if ('serviceWorker' in navigator) {
        const onLoad = () => {
          window.removeEventListener('load', onLoad)

          const workers = `{{PROJECT_SERVICE_WORKERS}}`.split(',')
          
          workers.forEach(worker => {
            if (worker) {
              navigator.serviceWorker.register(worker).catch((error) => {
                console.error('Service Worker registration failed:', error)
              })
            }
          })
        }

        window.addEventListener('load', onLoad)
      }
    </script>
  </body>
</html>
